[project]
name = "tectonica-api"
version = "0.1.0"
description = "Geospatial domain API for the Tectonica interactive globe"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
geo = ["geopandas>=1.0", "shapely>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
